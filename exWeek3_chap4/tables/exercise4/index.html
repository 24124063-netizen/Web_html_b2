
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Course List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Academic Course List</h1>

        <table>
            <thead>
                <tr>
                    <th rowspan="2">Course Group</th>
                    <th rowspan="2">Course Name</th>
                    <th colspan="2">Credits</th>
                </tr>
                <tr>
                    <th>Theory</th>
                    <th>Practice / Assignment</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td rowspan="3" class="group">I<br>Basic Major</td>
                    <td>Principles of Management</td>
                    <td>3</td>
                    <td>0</td>
                </tr>
                <tr>
                    <td>Business Statistics</td>
                    <td>2</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>Human Resource Management</td>
                    <td>2</td>
                    <td>1</td>
                </tr>

                <tr>
                    <td rowspan="3" class="group">II<br>Specialization</td>
                    <td>Production Management</td>
                    <td>2</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>Quality Management</td>
                    <td>2</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>Supply Chain Management</td>
                    <td>2</td>
                    <td>1</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
