
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Registration Form</h1>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <small class="error" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Enter your email">
                <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" placeholder="Enter your phone number">
                <small class="error" id="phoneError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 10 characters">
                <small class="error" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="retypePassword">Retype Password</label>
                <input type="password" id="retypePassword" placeholder="Confirm your password">
                <small class="error" id="retypeError"></small>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" rows="4"
                    placeholder="Write something about yourself (maximum 200 characters)"></textarea>
                <small class="error" id="descriptionError"></small>
            </div>

            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
