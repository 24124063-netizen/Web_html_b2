<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student Scores Table</title>
</head>
<body>
<main>
<h1>Student Scores Table</h1>
<table border="1" cellpadding="10">
  <tr>
    <th rowspan="2">Student Name</th>
    <th colspan="2">Scores</th>
  </tr>
  <tr>
    <th>Math</th>
    <th>English</th>
  </tr>
  <tr>
    <td>Alice</td>
    <td>85</td>
    <td>90</td>
  </tr>
  <tr>
    <td>Bob</td>
    <td>78</td>
    <td>88</td>
  </tr>
  <tr>
    <td>Charlie</td>
    <td>92</td>
    <td>95</td>
  </tr>
  <tr>
    <th>Average</th>
    <th>85</th>
    <th>91</th>
  </tr>
</table>
</main>
</body>
</html>
