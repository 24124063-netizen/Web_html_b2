<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feedback Form</title>
</head>
<body>
<main>
<h1>Feedback Form</h1>
<form name="feedbackForm" action="#" method="post">
  <label for="name"><strong>Name:</strong></label><br>
  <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

  <label for="country"><strong>Country:</strong></label><br>
  <select id="country" name="country">
    <option value="vn">Vietnam</option>
    <option value="us">USA</option>
    <option value="uk">UK</option>
  </select><br><br>

  <label for="comment"><strong>Comment:</strong></label><br>
  <textarea id="comment" name="comment" rows="6" cols="40" placeholder="Write your feedback here..."></textarea><br><br>

  <button type="submit">Submit</button>
</form>
</main>
</body>
</html>
