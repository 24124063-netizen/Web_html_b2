<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart and Grand Total</title>
</head>
<body>

    <h1>Shopping Cart and Grand Total</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Product Name</th>
            <th>Price ($)</th>
            <th>Quantity</th>
            <th>Total ($)</th>
        </tr>

        <tr>
            <td>Notebook</td>
            <td>5</td>
            <td>3</td>
            <td>15</td>
        </tr>

        <tr>
            <td>Pen</td>
            <td>2</td>
            <td>5</td>
            <td>10</td>
        </tr>

        <tr>
            <td>Backpack</td>
            <td>20</td>
            <td>2</td>
            <td>40</td>
        </tr>

        <tr>
            <th colspan="3">Grand Total</th>
            <th>65</th>
        </tr>
    </table>

</body>
</html>
