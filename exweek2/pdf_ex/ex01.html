    <h1>How to Make Vietnamese Iced Coffee</h1>

    <p>Follow these five easy steps to prepare your drink.</p>

    <ol>
        <li>Prepare a glass and add ice cubes.</li>
        <li>Put condensed milk into the glass.</li>
        <li>Brew strong Vietnamese coffee.</li>
        <li>Pour the coffee over the ice and milk.</li>
        <li>Stir well and enjoy your drink.</li>
    </ol>
