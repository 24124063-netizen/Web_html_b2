
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Table with Rowspan and Colspan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Academic Results</h1>

        <table>
            <caption>Semester 1 Results</caption>

            <thead>
                <tr>
                    <th rowspan="2">Student ID</th>
                    <th rowspan="2">Full Name</th>
                    <th colspan="3">Subject Scores</th>
                    <th rowspan="2">Average</th>
                </tr>
                <tr>
                    <th>HTML</th>
                    <th>CSS</th>
                    <th>JavaScript</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>SV001</td>
                    <td>Nguyen Van An</td>
                    <td>8.5</td>
                    <td>9.0</td>
                    <td>8.0</td>
                    <td>8.5</td>
                </tr>

                <tr>
                    <td>SV002</td>
                    <td>Tran Thi Binh</td>
                    <td>9.0</td>
                    <td>8.5</td>
                    <td>9.5</td>
                    <td>9.0</td>
                </tr>

                <tr>
                    <td>SV003</td>
                    <td>Le Van Cuong</td>
                    <td>7.5</td>
                    <td>8.0</td>
                    <td>7.0</td>
                    <td>7.5</td>
                </tr>

                <tr>
                    <td colspan="2">Class Average</td>
                    <td>8.33</td>
                    <td>8.50</td>
                    <td>8.17</td>
                    <td>8.33</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
