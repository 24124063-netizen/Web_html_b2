
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Styling with Colors</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f7fa;
        }

        h1 {
            color: #23436a;
        }

        .ordered-list,
        .unordered-list {
            background-color: #dceaf7;
            padding: 25px 45px;
            border-radius: 8px;
            width: 350px;
        }

        li {
            background-color: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .unordered-list {
            background-color: #e4f3e8;
        }

        .unordered-list li {
            background-color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>List Styling with Colors</h1>

    <h2>Ordered List</h2>
    <ol class="ordered-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h2>Unordered List</h2>
    <ul class="unordered-list">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>
</body>
</html>
