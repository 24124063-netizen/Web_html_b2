
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List with Different Bullets</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            color: navy;
        }

        .circle-list {
            list-style-type: circle;
        }

        .square-list {
            list-style-type: square;
        }

        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Unordered Lists with Different Bullets</h1>

    <h2>Circle Bullets</h2>
    <ul class="circle-list">
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>

    <h2>Square Bullets</h2>
    <ul class="square-list">
        <li>Dog</li>
        <li>Cat</li>
        <li>Rabbit</li>
    </ul>
</body>
</html>
