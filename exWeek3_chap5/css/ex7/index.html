
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #fff8ed;
        }

        h1 {
            color: #a0522d;
        }

        dl {
            max-width: 500px;
            padding: 20px;
            background-color: #ffe8c7;
            border-radius: 10px;
        }

        dt {
            color: #a0522d;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        dd {
            color: #444;
            font-size: 16px;
            padding: 8px 0;
            margin-left: 20px;
        }
    </style>
</head>
<body>
    <h1>Description List of Fruits</h1>

    <dl>
        <dt>Apple</dt>
        <dd>A sweet fruit that can be red, green, or yellow.</dd>

        <dt>Banana</dt>
        <dd>A long yellow fruit rich in potassium.</dd>

        <dt>Orange</dt>
        <dd>A citrus fruit known for its sweet and sour taste.</dd>
    </dl>
</body>
</html>
