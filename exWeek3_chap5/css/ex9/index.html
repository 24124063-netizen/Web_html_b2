
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with CSS Styling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f0f4f8;
        }

        h1 {
            color: #23436a;
            text-align: center;
        }

        table {
            width: 600px;
            max-width: 100%;
            margin: 30px auto;
            border: 1px solid #333;
            border-collapse: collapse;
        }

        caption {
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            color: #23436a;
        }

        th, td {
            border: 1px solid #333;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #315f8c;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #e4edf6;
        }
    </style>
</head>
<body>
    <h1>Table with CSS Styling</h1>

    <table>
        <caption>Student Information</caption>

        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Score</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>001</td>
                <td>Nguyen Van An</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>002</td>
                <td>Tran Thi Binh</td>
                <td>9.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
