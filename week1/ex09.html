<body>
    <h1>Science and Mathematics Notes</h1>
    <p>Water: H<sub>2</sub>O</p>
    <p>Carbon dioxide: CO<sub>2</sub></p>
    <p>Square: x<sup>2</sup></p>
    <p>Area: m<sup>2</sup></p>
    <p>Use subscript for characters written below the baseline, such as numbers in chemical formulas; use superscript for characters above it, such as exponents and squared units.</p>
</body>
