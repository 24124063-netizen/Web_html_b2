
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List Style Type - ul</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>list-style-type: disc (default)</h2>
    <ul class="disc">
        <li>Item One</li>
        <li>Item Two</li>
    </ul>

    <h2>list-style-type: circle</h2>
    <ul class="circle">
        <li>Item One</li>
        <li>Item Two</li>
    </ul>

    <h2>list-style-type: square</h2>
    <ul class="square">
        <li>Item One</li>
        <li>Item Two</li>
    </ul>

    <h2>list-style-type: none</h2>
    <ul class="none">
        <li>Item One</li>
        <li>Item Two</li>
    </ul>

    <h2>Custom Marker using CSS ::before</h2>
    <ul class="custom-marker">
        <li>Item One</li>
        <li>Item Two</li>
    </ul>

</body>
</html>
